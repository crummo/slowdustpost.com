<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slowdust Post — Cinematic (mockup)</title>
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Unbounded:wght@800&display=swap" rel="stylesheet">
  <style>
    /* A title card on a projected print: letterboxed frame, focus-pulled serif title, and the
       dust is literal — specks, hairs and scratches on the film, stepped at 24fps.
       ?font=unbounded swaps the title back to the current wordmark font for comparison. */
    :root {
      --ink: #efe6d2;
      --dim: rgba(239, 230, 210, 0.5);
      --title-font: "Cormorant Garamond", Georgia, serif;
      --title-weight: 500;
      --title-track: 0.32em;
      --bar: 12vh;
    }

    :root.alt-font {
      --title-font: "Unbounded", sans-serif;
      --title-weight: 800;
      --title-track: 0.04em;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--ink);
    }

    body {
      font: italic 400 15px/1.4 "Cormorant Garamond", Georgia, serif;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
    }

    /* 2.39:1 scope frame; 4:5 on portrait screens where a letterbox would be a sliver. */
    .frame {
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(100vw, 239vh);
      aspect-ratio: 2.39 / 1;
      transform: translate(-50%, -50%);
      overflow: hidden;
      container-type: size;
      background:
        radial-gradient(ellipse 60% 70% at 50% 48%, #1d1912 0%, #110f0b 55%, #070605 100%);
    }

    @media (max-aspect-ratio: 1 / 1) {
      .frame {
        width: 100vw;
        aspect-ratio: 4 / 5;
      }
    }

    .weave {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      will-change: transform;
    }

    .card { text-align: center; }

    h1 {
      font-family: var(--title-font);
      font-weight: var(--title-weight);
      font-style: normal;
      font-size: 6.4cqw;
      line-height: 1;
      letter-spacing: var(--title-track);
      margin-right: calc(var(--title-track) * -1); /* keep the tracked word optically centred */
      text-transform: uppercase;
      color: var(--ink);
      text-shadow:
        0 0 0.06em rgba(255, 140, 80, 0.45),
        0 0 0.3em rgba(255, 96, 48, 0.18);
      opacity: 0;
      animation: pull 3.6s cubic-bezier(0.3, 0, 0.15, 1) 1.4s forwards;
    }

    @media (max-aspect-ratio: 1 / 1) {
      h1 { font-size: 10cqw; }
      h1 .word { display: block; }
      h1 .word + .word { margin-top: 0.2em; }
    }

    .sub {
      margin-top: 2.4cqw;
      font-size: max(14px, 1.5cqw);
      color: var(--dim);
      letter-spacing: 0.12em;
      opacity: 0;
      animation: fade 2.4s ease 4.8s forwards;
    }

    @media (max-aspect-ratio: 1 / 1) {
      .sub { margin-top: 6cqw; font-size: 15px; }
    }

    /* Focus pull: soft and slightly large, settling sharp. */
    @keyframes pull {
      0%   { opacity: 0; filter: blur(14px); transform: scale(1.04); }
      35%  { opacity: 1; }
      100% { opacity: 1; filter: blur(0.25px); transform: scale(1); }
    }

    @keyframes fade {
      to { opacity: 1; }
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #grain { mix-blend-mode: overlay; opacity: 0.55; }

    .flicker {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: #fff6e4;
      opacity: 0;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0, 0, 0, 0.7) 100%);
    }

    /* Credits in the letterbox bars. */
    .bar {
      position: fixed;
      left: 0;
      right: 0;
      height: var(--bar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 clamp(16px, 4vw, 56px);
      color: var(--dim);
      opacity: 0;
      animation: fade 2s ease 6s forwards;
    }

    .bar.top { top: 0; }
    .bar.bottom { bottom: 0; }

    .bar span:last-child { text-align: right; }

    a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(239, 230, 210, 0.25);
      transition: border-color 0.4s;
    }

    a:hover, a:focus-visible { border-color: var(--ink); outline: none; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }

    @media (prefers-reduced-motion: reduce) {
      h1, .sub, .bar { animation: none; opacity: 1; filter: none; }
    }
  </style>
</head>
<body>
  <div class="frame" id="frame">
    <div class="weave" id="weave">
      <div class="card">
        <h1><span class="word">Slowdust</span> <span class="word">Post</span></h1>
        <p class="sub">Edit &nbsp;·&nbsp; Grade &nbsp;·&nbsp; Finish</p>
      </div>
    </div>
    <div class="flicker" id="flicker"></div>
    <canvas id="grain" aria-hidden="true"></canvas>
    <canvas id="dust" aria-hidden="true"></canvas>
    <div class="vignette"></div>
  </div>

  <div class="bar top"><span>Post production</span><span>Los Angeles</span></div>
  <div class="bar bottom"><span>New projects</span><a href="mailto:cameron@slowdustpost.com">cameron@slowdustpost.com</a></div>

  <script>
    (() => {
      if (new URLSearchParams(location.search).get('font') === 'unbounded') {
        document.documentElement.classList.add('alt-font');
      }

      const frame = document.getElementById('frame');
      const weave = document.getElementById('weave');
      const flicker = document.getElementById('flicker');
      const grain = document.getElementById('grain');
      const dust = document.getElementById('dust');
      const g = grain.getContext('2d');
      const d = dust.getContext('2d');
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

      let W = 0;
      let H = 0;

      // A handful of noise tiles, picked and offset at random each frame.
      const TILE = 220;
      const tiles = Array.from({ length: 6 }, () => {
        const c = document.createElement('canvas');
        c.width = c.height = TILE;
        const x = c.getContext('2d');
        const img = x.createImageData(TILE, TILE);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = 128 + (Math.random() + Math.random() + Math.random() - 1.5) * 150;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        x.putImageData(img, 0, 0);
        return c;
      });

      function size() {
        const r = frame.getBoundingClientRect();
        W = Math.round(r.width);
        H = Math.round(r.height);
        // Grain and dust stay at CSS-pixel resolution: soft, like a print.
        grain.width = dust.width = W;
        grain.height = dust.height = H;
        const bar = Math.max(0, (innerHeight - r.height) / 2);
        document.documentElement.style.setProperty('--bar', `${Math.max(bar, 56)}px`);
      }

      function drawGrain() {
        const t = tiles[(Math.random() * tiles.length) | 0];
        const ox = -Math.random() * TILE;
        const oy = -Math.random() * TILE;
        for (let y = oy; y < H; y += TILE) {
          for (let x = ox; x < W; x += TILE) g.drawImage(t, x, y);
        }
      }

      // Long-lived scratches drift a little and fade out over a few seconds.
      const scratches = [];

      function speck(x, y, r, light) {
        d.fillStyle = light ? 'rgba(246, 238, 220, 0.85)' : 'rgba(10, 8, 6, 0.8)';
        d.beginPath();
        // Irregular blob rather than a perfect dot.
        const n = 6;
        for (let i = 0; i <= n; i++) {
          const a = (i / n) * Math.PI * 2;
          const rr = r * (0.6 + Math.random() * 0.6);
          d.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        }
        d.fill();
      }

      function hair(x, y, len, light) {
        d.strokeStyle = light ? 'rgba(246, 238, 220, 0.7)' : 'rgba(10, 8, 6, 0.75)';
        d.lineWidth = 0.8 + Math.random() * 0.6;
        d.beginPath();
        d.moveTo(x, y);
        const a = Math.random() * Math.PI * 2;
        d.bezierCurveTo(
          x + Math.cos(a) * len * 0.5 + (Math.random() - 0.5) * len,
          y + Math.sin(a) * len * 0.5 + (Math.random() - 0.5) * len,
          x + Math.cos(a) * len * 0.8 + (Math.random() - 0.5) * len * 0.6,
          y + Math.sin(a) * len * 0.8 + (Math.random() - 0.5) * len * 0.6,
          x + Math.cos(a) * len,
          y + Math.sin(a) * len,
        );
        d.stroke();
      }

      function drawDust() {
        d.clearRect(0, 0, W, H);
        const scale = W / 1400;

        // Specks: most frames have one or two, now and then a burst.
        const count = Math.random() < 0.08 ? 6 + ((Math.random() * 6) | 0) : (Math.random() * 3) | 0;
        for (let i = 0; i < count; i++) {
          speck(Math.random() * W, Math.random() * H, (0.8 + Math.random() * Math.random() * 4) * Math.max(scale, 0.6), Math.random() < 0.7);
        }
        if (Math.random() < 0.05) hair(Math.random() * W, Math.random() * H, (30 + Math.random() * 90) * Math.max(scale, 0.6), Math.random() < 0.6);

        if (Math.random() < 0.006 && scratches.length < 2) {
          scratches.push({ x: Math.random() * W, life: 40 + Math.random() * 90, age: 0, light: Math.random() < 0.7 });
        }
        for (let i = scratches.length - 1; i >= 0; i--) {
          const s = scratches[i];
          s.age++;
          s.x += (Math.random() - 0.5) * 1.2;
          const a = Math.sin((s.age / s.life) * Math.PI) * (0.25 + Math.random() * 0.2);
          d.fillStyle = s.light ? `rgba(246, 238, 220, ${a})` : `rgba(0, 0, 0, ${a})`;
          d.fillRect(s.x, 0, 1, H);
          if (s.age > s.life) scratches.splice(i, 1);
        }
      }

      // Gate weave: a small random walk, pulled back toward centre.
      let wx = 0;
      let wy = 0;

      function frameTick() {
        wx = wx * 0.7 + (Math.random() - 0.5) * 0.9;
        wy = wy * 0.7 + (Math.random() - 0.5) * 1.2;
        weave.style.transform = `translate(${wx.toFixed(2)}px, ${wy.toFixed(2)}px)`;
        flicker.style.opacity = (Math.random() * 0.028).toFixed(3);
        drawGrain();
        drawDust();
      }

      size();
      window.addEventListener('resize', size);

      if (still) {
        drawGrain();
        return;
      }

      // Step at 24fps rather than the display rate; the stutter is part of the look.
      let last = 0;
      function loop(now) {
        if (now - last >= 1000 / 24) {
          last = now;
          frameTick();
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
