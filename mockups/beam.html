<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slowdust Post — Beam (mockup)</title>
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Unbounded:wght@800&display=swap" rel="stylesheet">
  <style>
    /* The cinematic title card, lit by a projector: a band of light sweeps across the dark frame,
       lighting dust motes as it passes and leaving the title lit behind it. Then it settles into a
       soft pool over the title, with the motes still drifting through.
       ?font=unbounded swaps the title back to the current wordmark font for comparison. */
    :root {
      --ink: #efe6d2;
      --dim: rgba(239, 230, 210, 0.5);
      --title-font: "Cormorant Garamond", Georgia, serif;
      --title-weight: 500;
      --title-track: 0.32em;
      --bar: 12vh;
      --bx: -30%;   /* beam centre, across the title */
      --bw: 18%;    /* half-width of the beam's hot edge */
      --lit: 0;     /* how lit the title stays behind the beam */
    }

    :root.alt-font {
      --title-font: "Unbounded", sans-serif;
      --title-weight: 800;
      --title-track: 0.04em;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--ink);
    }

    body {
      font: italic 400 15px/1.4 "Cormorant Garamond", Georgia, serif;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(100vw, 239vh);
      aspect-ratio: 2.39 / 1;
      transform: translate(-50%, -50%);
      overflow: hidden;
      container-type: size;
      background: #070605;
    }

    @media (max-aspect-ratio: 1 / 1) {
      .frame {
        width: 100vw;
        aspect-ratio: 4 / 5;
      }
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .weave {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      will-change: transform;
    }

    .card { text-align: center; }

    .title-wrap { position: relative; }

    h1, .hot {
      font-family: var(--title-font);
      font-weight: var(--title-weight);
      font-style: normal;
      font-size: 6.4cqw;
      line-height: 1;
      letter-spacing: var(--title-track);
      margin-right: calc(var(--title-track) * -1);
      text-transform: uppercase;
    }

    /* The title as it rests: dark ahead of the beam, lit behind it. */
    h1 {
      color: var(--ink);
      text-shadow: 0 0 0.06em rgba(255, 140, 80, 0.4), 0 0 0.3em rgba(255, 96, 48, 0.14);
      -webkit-mask-image: linear-gradient(90deg,
        rgba(0, 0, 0, var(--lit)) calc(var(--bx) - var(--bw)),
        #000 var(--bx),
        transparent calc(var(--bx) + var(--bw)));
      mask-image: linear-gradient(90deg,
        rgba(0, 0, 0, var(--lit)) calc(var(--bx) - var(--bw)),
        #000 var(--bx),
        transparent calc(var(--bx) + var(--bw)));
    }

    /* The same letters, overexposed, only where the beam is hottest. */
    .hot {
      position: absolute;
      inset: 0;
      color: #fff7e6;
      text-shadow: 0 0 0.08em rgba(255, 190, 120, 0.9), 0 0 0.5em rgba(255, 120, 60, 0.45);
      -webkit-mask-image: radial-gradient(ellipse var(--bw) 160% at var(--bx) 50%, #000, transparent);
      mask-image: radial-gradient(ellipse var(--bw) 160% at var(--bx) 50%, #000, transparent);
      pointer-events: none;
    }

    @media (max-aspect-ratio: 1 / 1) {
      h1, .hot { font-size: 10cqw; }
      .word { display: block; }
      .word + .word { margin-top: 0.2em; }
    }

    .sub {
      margin-top: 2.4cqw;
      font-size: max(14px, 1.5cqw);
      color: var(--dim);
      letter-spacing: 0.12em;
      opacity: 0;
      transition: opacity 2.4s ease;
    }

    .on .sub { opacity: 1; }

    @media (max-aspect-ratio: 1 / 1) {
      .sub { margin-top: 6cqw; font-size: 15px; }
    }

    #grain { mix-blend-mode: overlay; opacity: 0.45; }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0, 0, 0, 0.75) 100%);
    }

    .bar {
      position: fixed;
      left: 0;
      right: 0;
      height: var(--bar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 clamp(16px, 4vw, 56px);
      color: var(--dim);
      opacity: 0;
      transition: opacity 2s ease 1.2s;
    }

    .on .bar { opacity: 1; }
    .bar.top { top: 0; }
    .bar.bottom { bottom: 0; }
    .bar span:last-child { text-align: right; }

    a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(239, 230, 210, 0.25);
      transition: border-color 0.4s;
    }

    a:hover, a:focus-visible { border-color: var(--ink); outline: none; }
  </style>
</head>
<body>
  <div class="frame" id="frame">
    <canvas id="light" aria-hidden="true"></canvas>
    <div class="weave" id="weave">
      <div class="card">
        <div class="title-wrap">
          <h1><span class="word">Slowdust</span> <span class="word">Post</span></h1>
          <div class="hot" aria-hidden="true"><span class="word">Slowdust</span> <span class="word">Post</span></div>
        </div>
        <p class="sub">Edit &nbsp;·&nbsp; Grade &nbsp;·&nbsp; Finish</p>
      </div>
    </div>
    <canvas id="motes" aria-hidden="true"></canvas>
    <canvas id="grain" aria-hidden="true"></canvas>
    <div class="vignette"></div>
  </div>

  <div class="bar top"><span>Post production</span><span>Los Angeles</span></div>
  <div class="bar bottom"><span>New projects</span><a href="mailto:cameron@slowdustpost.com">cameron@slowdustpost.com</a></div>

  <script>
    (() => {
      const root = document.documentElement;
      if (new URLSearchParams(location.search).get('font') === 'unbounded') root.classList.add('alt-font');

      const frame = document.getElementById('frame');
      const weave = document.getElementById('weave');
      const light = document.getElementById('light');
      const motes = document.getElementById('motes');
      const grain = document.getElementById('grain');
      const l = light.getContext('2d');
      const m = motes.getContext('2d');
      const g = grain.getContext('2d');
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

      let W = 0;
      let H = 0;
      let titleBox = { x: 0, w: 1 };

      const TILE = 220;
      const tiles = Array.from({ length: 6 }, () => {
        const c = document.createElement('canvas');
        c.width = c.height = TILE;
        const x = c.getContext('2d');
        const img = x.createImageData(TILE, TILE);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = 128 + (Math.random() + Math.random() + Math.random() - 1.5) * 150;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        x.putImageData(img, 0, 0);
        return c;
      });

      // Motes hang in the air and drift; they only show where the beam catches them.
      let dust = [];

      function size() {
        const r = frame.getBoundingClientRect();
        W = Math.round(r.width);
        H = Math.round(r.height);
        for (const c of [light, motes, grain]) {
          c.width = W;
          c.height = H;
        }
        const bar = Math.max(0, (innerHeight - r.height) / 2);
        root.style.setProperty('--bar', `${Math.max(bar, 56)}px`);
        const t = document.querySelector('h1').getBoundingClientRect();
        titleBox = { x: t.left - r.left, w: t.width };
        const n = Math.round((W * H) / 2600);
        dust = Array.from({ length: n }, () => ({
          x: Math.random() * W,
          y: Math.random() * H,
          z: Math.random(),             // depth: near motes are bigger, softer and faster
          vx: (Math.random() - 0.5) * 0.15,
          vy: (Math.random() - 0.5) * 0.1,
          ph: Math.random() * Math.PI * 2,
        }));
      }

      // Timeline (seconds): the beam sweeps across, then eases back to rest over the title.
      const SWEEP_START = 1.2;
      const SWEEP = 4.2;
      const SETTLE = 2.6;
      const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
      const clamp = (v) => Math.min(1, Math.max(0, v));

      // Beam state in frame pixels: centre x, half-width, and brightness.
      function beamAt(t) {
        const sweep = clamp((t - SWEEP_START) / SWEEP);
        const settle = clamp((t - SWEEP_START - SWEEP) / SETTLE);
        const from = -0.25 * W;
        const to = 1.12 * W;
        let x = from + (to - from) * ease(sweep);
        let w = W * 0.07;
        let a = Math.min(1, sweep * 6) * (1 - 0.6 * ease(settle));
        // After the pass, a wide soft pool fades up over the title.
        const pool = ease(settle);
        return { x, w, a, pool, sweep };
      }

      function drawLight(b) {
        l.clearRect(0, 0, W, H);
        // Light falling on the screen behind the title: a soft vertical band, slightly warm.
        if (b.a > 0.01) {
          const grad = l.createLinearGradient(b.x - b.w * 3, 0, b.x + b.w * 3, 0);
          grad.addColorStop(0, 'rgba(255, 220, 170, 0)');
          grad.addColorStop(0.5, `rgba(255, 220, 170, ${0.13 * b.a})`);
          grad.addColorStop(1, 'rgba(255, 220, 170, 0)');
          l.fillStyle = grad;
          l.fillRect(0, 0, W, H);
        }
        if (b.pool > 0.01) {
          const r = Math.max(W, H) * 0.55;
          const grad = l.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, r);
          grad.addColorStop(0, `rgba(48, 40, 28, ${b.pool})`);
          grad.addColorStop(0.6, `rgba(22, 19, 14, ${b.pool})`);
          grad.addColorStop(1, 'rgba(7, 6, 5, 0)');
          l.fillStyle = grad;
          l.fillRect(0, 0, W, H);
        }
      }

      function lightAt(x, y, b) {
        const dx = (x - b.x) / (b.w * 2.2);
        const band = Math.exp(-dx * dx) * b.a;
        const px = (x - W / 2) / (W * 0.34);
        const py = (y - H / 2) / (H * 0.42);
        const pool = Math.exp(-(px * px + py * py)) * b.pool * 0.95;
        return Math.max(band, pool);
      }

      function drawMotes(b, t) {
        m.clearRect(0, 0, W, H);
        const scale = Math.max(W / 1400, 0.6);
        for (const p of dust) {
          p.x += p.vx + Math.sin(t * 0.3 + p.ph) * 0.05;
          p.y += p.vy + Math.cos(t * 0.23 + p.ph) * 0.04 - 0.02;
          if (p.x < -10) p.x += W + 20;
          if (p.x > W + 10) p.x -= W + 20;
          if (p.y < -10) p.y += H + 20;
          if (p.y > H + 10) p.y -= H + 20;
          const lit = lightAt(p.x, p.y, b);
          if (lit < 0.02) continue;
          const twinkle = 0.7 + 0.3 * Math.sin(t * 2 + p.ph * 3);
          m.fillStyle = `rgba(255, 238, 210, ${lit * twinkle * (0.35 + p.z * 0.6)})`;
          m.beginPath();
          m.arc(p.x, p.y, (0.5 + p.z * p.z * 1.8) * scale, 0, Math.PI * 2);
          m.fill();
        }
      }

      function drawGrain() {
        const tile = tiles[(Math.random() * tiles.length) | 0];
        const ox = -Math.random() * TILE;
        const oy = -Math.random() * TILE;
        for (let y = oy; y < H; y += TILE) {
          for (let x = ox; x < W; x += TILE) g.drawImage(tile, x, y);
        }
      }

      // The title's mask works in percent of its own box.
      function setTitleVars(b) {
        const pct = ((b.x - titleBox.x) / titleBox.w) * 100;
        const w = ((b.w * 1.6) / titleBox.w) * 100;
        root.style.setProperty('--bx', `${pct.toFixed(2)}%`);
        root.style.setProperty('--bw', `${w.toFixed(2)}%`);
        // Behind the beam the title holds lit; once it settles everything is up.
        root.style.setProperty('--lit', (0.55 + 0.45 * b.pool).toFixed(3));
      }

      let wx = 0;
      let wy = 0;
      let started = 0;
      let shownRest = false;

      function frameTick(now) {
        const t = (now - started) / 1000;
        const b = beamAt(t);
        wx = wx * 0.7 + (Math.random() - 0.5) * 0.7;
        wy = wy * 0.7 + (Math.random() - 0.5) * 0.9;
        weave.style.transform = `translate(${wx.toFixed(2)}px, ${wy.toFixed(2)}px)`;
        setTitleVars(b);
        drawLight(b);
        drawMotes(b, t);
        drawGrain();
        if (!shownRest && b.sweep > 0.85) {
          shownRest = true;
          document.body.classList.add('on');
        }
      }

      size();
      window.addEventListener('resize', size);
      document.fonts.ready.then(size); // the title's width changes once the serif loads

      if (still) {
        const b = { x: W / 2, w: W * 0.07, a: 0, pool: 1, sweep: 1 };
        setTitleVars(b);
        drawLight(b);
        drawMotes(b, 0);
        drawGrain();
        document.body.classList.add('on');
        return;
      }

      // 24fps, like the rest of the cinematic set.
      let last = 0;
      function loop(now) {
        if (!started) started = now;
        if (now - last >= 1000 / 24) {
          last = now;
          frameTick(now);
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
