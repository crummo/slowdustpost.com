  <style>
    :root { --amber: #deaa62; }

    .corner { z-index: 4; }

    /* Slate: names the project currently lighting the dust. */
    #reel {
      color: var(--dim);
      border-bottom-color: transparent;
      transition: color 0.3s, border-color 0.3s;
    }

    #reel:hover,
    #reel:focus-visible {
      color: var(--ink);
      border-bottom-color: rgba(236, 227, 207, 0.3);
    }

    #work-toggle[aria-expanded="true"] {
      color: var(--amber);
      border-bottom-color: var(--amber);
    }

    .work {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: calc(var(--pad) * 4) var(--pad);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    /* The dust gathers into the list's own letters first; the crisp text fades in over it. */
    .work-head {
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .work.open .work-head {
      opacity: 1;
      transition-delay: 1.6s;
    }

    .work.open {
      opacity: 1;
      pointer-events: auto;
    }

    .work-inner {
      width: min(760px, 100%);
      max-height: 100%;
      overflow-y: auto;
    }

    .work-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 14px;
      color: var(--dim);
    }

    .work-head button {
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      transition: color 0.3s;
    }

    .work-head button:hover,
    .work-head button:focus-visible { color: var(--ink); outline: none; }

    .work-list {
      list-style: none;
      padding: 0;
    }

    .work-list a {
      display: grid;
      grid-template-columns: 22ch 1fr 12ch 2ch;
      gap: 16px;
      align-items: baseline;
      padding: 14px 0;
      border: 0;
      border-bottom: 1px solid rgba(236, 227, 207, 0.12);
      transition: color 0.25s, padding 0.35s ease;
    }

    .work-list li:first-child a { border-top: 1px solid rgba(236, 227, 207, 0.12); }

    .work-list .client,
    .work-list .kind { color: var(--dim); transition: color 0.25s; }

    .work-list .kind { text-align: right; white-space: nowrap; }
    .work-list .arrow { text-align: right; opacity: 0; transition: opacity 0.25s, transform 0.35s ease; transform: translateX(-6px); }

    .work-list a:hover,
    .work-list a:focus-visible {
      color: var(--amber);
      padding-left: 10px;
      outline: none;
    }

    .work-list a:hover .client,
    .work-list a:hover .kind { color: var(--amber); }
    .work-list a:hover .arrow,
    .work-list a:focus-visible .arrow { opacity: 1; transform: none; }

    /* Rows resolve one after another as the dust settles into them. No transform: the dust is
       aimed at where the text sits, so the text must not move. */
    .work-list li {
      opacity: 0;
    }

    .work.open .work-list li {
      opacity: 1;
      transition: opacity 1.2s ease;
      transition-delay: calc(1.6s + var(--i) * 0.14s);
    }

    .work.open ~ .hint { opacity: 0; }

    /* While the player is up its dust has left the list, so the list goes too; it comes back
       (with its trace) when the player closes. */
    body:has(.player.open) .work { opacity: 0; transition: opacity 0.6s ease; }

    @media (max-width: 640px) {
      .work-list a {
        grid-template-columns: 1fr;
        row-gap: 2px;
      }

      .work-list .client { grid-row: 2; }
      .work-list .kind,
      .work-list .arrow { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .work, .work-list li, .work.open .work-list li { transition: none; }
    }
  </style>

  <script>
    // One project per gather, in `reel` order, named in the slate. The dust stays bone; set
    // SLOWDUST_TINT to true to colour it from each project's still instead.
    window.SLOWDUST_TINT = false;
    window.SLOWDUST_FOOTAGE = SLOWDUST_WORK
      .filter((w) => w.reel)
      .sort((a, b) => a.reel - b.reel)
      .map((w) => ({ src: w.thumb, label: w.short || w.client, href: `work/${w.slug}/` }));
  </script>

<body>
  <canvas id="dust" aria-hidden="true"></canvas>
  <h1 class="sr-only">Slowdust Post</h1>

  <div class="corner tl">Slowdust Post<br><span class="dim">Los Angeles, CA</span></div>
  <div class="corner tr"><span class="dim">TC</span> <span id="tc">01:00:00:00</span><br><a id="reel" href="./" data-embed></a></div>
  <div class="corner bl">Post production —<br><a href="#work" id="work-toggle" aria-expanded="false" aria-controls="work">Edit / Grade / Finish</a></div>
  <div class="corner br">— Contact<br><a href="mailto:cameron@slowdustpost.com">cameron@slowdustpost.com</a></div>

  <section class="work" id="work" aria-hidden="true" aria-label="Selected work" data-ui>
    <div class="work-inner">
      <div class="work-head">
        <span>Selected work</span>
        <button type="button" id="work-close">Close ✕</button>
      </div>
      <ol class="work-list" id="work-list"></ol>
    </div>
  </section>

  <p class="hint" id="hint">Move to disturb · Click to scatter or gather · T for controls</p>

  <script src="main.js" defer></script>
  <script src="player.js"></script>
  <script>
    const work = document.getElementById('work');
    const toggle = document.getElementById('work-toggle');
    let isOpen = false;

    // Each row links to the project's own page (work/<slug>/); the player plays it in place.
    document.getElementById('work-list').innerHTML = SLOWDUST_WORK.map(({ slug, client, title, kind, video }, i) => `
      <li style="--i:${i}">
        <a href="work/${slug}/" data-embed data-slug="${slug}" data-video="${video}" data-caption="${client} — ${title}">
          <span class="client">${client}</span>
          <span class="title">${title}</span>
          <span class="kind">${kind}</span>
          <span class="arrow">↗</span>
        </a>
      </li>`).join('');

    function open() {
      if (isOpen) return;
      isOpen = true;
      work.classList.add('open');
      work.setAttribute('aria-hidden', 'false');
      toggle.setAttribute('aria-expanded', 'true');
      if (location.hash !== '#work') history.replaceState(null, '', '#work');
      // The dust gathers into the list's text, measured where it sits once the overlay is open.
      window.slowdust?.form(work.querySelectorAll('.work-head span, .work-head button, .work-list a span'));
      document.getElementById('hint').classList.add('gone');
    }

    function close() {
      if (!isOpen) return;
      isOpen = false;
      work.classList.remove('open');
      work.setAttribute('aria-hidden', 'true');
      toggle.setAttribute('aria-expanded', 'false');
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      window.slowdust?.restore();
    }

    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      isOpen ? close() : open();
    });
    document.getElementById('work-close').addEventListener('click', close);
    work.addEventListener('click', (e) => {
      if (!e.target.closest('.work-inner')) close();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close();
    });
    window.addEventListener('hashchange', () => (location.hash === '#work' ? open() : close()));

    // /#work opens straight to the list.
    if (location.hash === '#work') {
      window.addEventListener('load', () => setTimeout(open, 600));
    }
  </script>
</body>
