<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="c"><circle cx="50" cy="50" r="48"/></clipPath>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0a0a0a"/>
  <!-- Red triangle pointing up -->
  <polygon points="50,8 85,78 15,78" fill="#FF006E" clip-path="url(#c)"/>
  <!-- Yellow triangle rotated 30° right -->
  <g transform="translate(50,50) rotate(30) translate(-50,-50)">
    <polygon points="50,22 85,92 15,92" fill="#FFE600" clip-path="url(#c)"/>
  </g>
  <!-- Teal triangle pointing down -->
  <polygon points="50,92 15,22 85,22" fill="#00E5CC" clip-path="url(#c)"/>
  <!-- Large magenta dot at intersection -->
  <circle cx="50" cy="56" r="20" fill="#FF40FF" clip-path="url(#c)"/>
  <!-- Dark cutout center -->
  <circle cx="50" cy="56" r="8" fill="#0a0a0a" clip-path="url(#c)"/>
</svg>
