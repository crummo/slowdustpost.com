<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="c"><circle cx="50" cy="50" r="48"/></clipPath>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0a0a0a"/>
  <g clip-path="url(#c)">
    <!-- 5 bold diagonal color slabs at clashing angles -->
    <polygon points="0,0 40,0 20,100 0,100"   fill="#FF006E"/>
    <polygon points="30,0 65,0 45,100 10,100"  fill="#FFE600"/>
    <polygon points="55,0 80,0 100,60 100,20"  fill="#00E5CC"/>
    <polygon points="70,0 100,0 100,55"        fill="#BF40FF"/>
    <polygon points="0,55 60,100 0,100"        fill="#FF6B35"/>
  </g>
</svg>
